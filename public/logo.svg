<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>OCGoQuota app icon</title>
  <desc>Rounded midnight-blue app icon with a mint quota ring, usage bars, and an upward arrow.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="72" x2="906" y2="956" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152343"/>
      <stop offset="0.52" stop-color="#173B63"/>
      <stop offset="1" stop-color="#0D172D"/>
    </linearGradient>
    <linearGradient id="ring" x1="265" y1="253" x2="765" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A4FFE1"/>
      <stop offset="0.48" stop-color="#55E3C0"/>
      <stop offset="1" stop-color="#39B7FF"/>
    </linearGradient>
    <linearGradient id="bars" x1="374" y1="414" x2="668" y2="701" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4FFFB"/>
      <stop offset="1" stop-color="#9CEFD9"/>
    </linearGradient>
    <linearGradient id="arrow" x1="666" y1="289" x2="790" y2="411" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE7A3"/>
      <stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>
    <filter id="shadow" x="112" y="116" width="800" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#071022" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="176" y="170" width="672" height="672" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="22" result="blur"/>
    </filter>
  </defs>

  <rect x="56" y="56" width="912" height="912" rx="224" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="57.5" y="57.5" width="909" height="909" rx="222.5" stroke="#8CB4D8" stroke-opacity="0.18" stroke-width="3"/>

  <circle cx="512" cy="512" r="274" stroke="#4CE0C1" stroke-opacity="0.13" stroke-width="70" filter="url(#glow)"/>
  <path d="M512 260C372.7 260 260 372.7 260 512C260 651.3 372.7 764 512 764C615.5 764 704.5 701.6 743.8 612" stroke="url(#ring)" stroke-width="70" stroke-linecap="round"/>
  <path d="M742 374L784 416L742 458" stroke="url(#arrow)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M780 416H696" stroke="url(#arrow)" stroke-width="42" stroke-linecap="round"/>

  <rect x="348" y="526" width="72" height="132" rx="24" fill="url(#bars)"/>
  <rect x="476" y="434" width="72" height="224" rx="24" fill="url(#bars)"/>
  <rect x="604" y="352" width="72" height="306" rx="24" fill="url(#bars)"/>
  <path d="M334 688H690" stroke="#D6FFF1" stroke-opacity="0.65" stroke-width="18" stroke-linecap="round"/>

  <circle cx="334" cy="688" r="9" fill="#FFE7A3"/>
  <circle cx="690" cy="688" r="9" fill="#55E3C0"/>
</svg>
